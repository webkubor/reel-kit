name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      # `reel templates` 会 import render.mjs → 需要 playwright-core。
      # 只跑 node --check 不装依赖是不够的：那只查语法，不解析 import。
      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 语法检查与模板枚举
        run: |
          node --check bin/reel.mjs
          for f in src/*.mjs; do node --check "$f"; done
          node bin/reel.mjs templates

      - name: lint
        run: node scripts/lint.mjs

      # 每个模板都必须能被占位符替换器处理，且不引外部资源 ——
      # 引了外链的模板在离线/CI 环境会静默渲染成空白，比报错更难查
      - name: 模板自包含检查
        run: |
          fail=0
          for t in templates/*.html; do
            if grep -qE '(src|href)="https?://' "$t"; then
              echo "❌ $t 引用了外部资源，模板必须自包含"; fail=1
            fi
            grep -q '{{caption}}' "$t" || { echo "❌ $t 缺 {{caption}} 占位符"; fail=1; }
            grep -q '{{image}}'   "$t" || { echo "❌ $t 缺 {{image}} 占位符"; fail=1; }
          done
          exit $fail

      - name: README 里的命令与 CLI 实际参数是否一致
        run: |
          node --test test/readme-cli.test.mjs
          node scripts/check-readme-cli.mjs

  # The shipping desktop product is Wails + the Go engine.
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/reel-studio-wails/go.mod
          cache-dependency-path: apps/reel-studio-wails/go.sum
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Compile frontend (build time only)
        working-directory: apps/reel-studio-wails/frontend
        run: |
          node --check src/app.js
          node --check src/select.js
          bash build.sh
          git diff --exit-code -- dist
      - name: Install media test dependencies
        run: brew install ffmpeg
      - name: Go engine and media regression tests
        working-directory: apps/reel-studio-wails
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build ./...

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/reel-studio-wails/go.mod
          cache-dependency-path: apps/reel-studio-wails/go.sum
      - name: Go engine build and tests (Windows)
        working-directory: apps/reel-studio-wails
        run: |
          go build ./...
          go test ./...

  # 后端（Node 工作台）里全是路径、临时目录、子进程调用 ——
  # 这些在 Windows 上和在 macOS 上不是一回事（分隔符、可执行后缀、
  # 路径里的空格、ffmpeg 的调用方式）。桌面端只是它的前端，
  # 后端在 Windows 上跑不通，桌面端就是空壳，所以后端也得在 Windows 上验。
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - name: 装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装视频测试依赖
        run: choco install ffmpeg -y --no-progress
      # 渲染用例要真浏览器：没有 Chrome 时用例会显式跳过（不是假装通过）。
      # 装不上也不该让整条流水线红 —— 跳过会在日志里写明原因。
      - name: 安装 Chrome（渲染用例需要）
        continue-on-error: true
        run: choco install googlechrome -y --no-progress
      - name: 后端工作台用例（Windows）
        run: pnpm test:studio
        env:
          CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
