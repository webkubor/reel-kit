name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      # `reel templates` 会 import render.mjs → 需要 playwright-core。
      # 只跑 node --check 不装依赖是不够的：那只查语法，不解析 import。
      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 语法检查与模板枚举
        run: |
          node --check bin/reel.mjs
          for f in src/*.mjs; do node --check "$f"; done
          node bin/reel.mjs templates

      - name: lint
        run: node scripts/lint.mjs

      # 每个模板都必须能被占位符替换器处理，且不引外部资源 ——
      # 引了外链的模板在离线/CI 环境会静默渲染成空白，比报错更难查
      - name: 模板自包含检查
        run: |
          fail=0
          for t in templates/*.html; do
            if grep -qE '(src|href)="https?://' "$t"; then
              echo "❌ $t 引用了外部资源，模板必须自包含"; fail=1
            fi
            grep -q '{{caption}}' "$t" || { echo "❌ $t 缺 {{caption}} 占位符"; fail=1; }
            grep -q '{{image}}'   "$t" || { echo "❌ $t 缺 {{image}} 占位符"; fail=1; }
          done
          exit $fail

      - name: README 里的命令与 CLI 实际参数是否一致
        run: |
          node --test test/readme-cli.test.mjs
          node scripts/check-readme-cli.mjs

  # 桌面端是 Go 原生界面：它的交互测试（版式几何、配置回填、对比选择器、
  # 截图走查）不开窗口就能跑，值得在 CI 里当门禁。
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/reel-studio/go.sum
      - name: 桌面端构建与测试
        working-directory: apps/reel-studio
        run: |
          go build ./...
          go test ./...
