name: 桌面端问题报告
description: Reel Studio（macOS / Windows 桌面应用）打不开、出片失败、没声音
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 系统
      options:
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Windows（x64）
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置页顶部显示的版本号，例如 1.3.0
      placeholder: 1.3.0
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: 出了什么事
      description: 你做了什么、期望什么、实际看到什么。写清楚是哪一步：打不开／工作台连不上／生成失败／成片不对／没声音
    validations: { required: true }
  - type: textarea
    id: diagnostic
    attributes:
      label: 排障报告（强烈建议附上）
      description: |
        应用内「设置与反馈 → 运行日志 → 导出排障报告」，会生成一个
        reel-studio-diagnostics-*.txt，把这个文件拖到这里当附件。

        里面有：版本与系统、通道就绪状态、**失败任务的报错原文**、工作台与界面最近几十行日志，
        密钥与令牌已自动遮盖。

        没有它我们只能猜；有它通常一次就能定位。
      render: text
  - type: textarea
    id: crash
    attributes:
      label: 崩溃日志（如果是闪退）
      description: |
        闪退时把崩溃日志贴上来：
        - Windows：资源管理器地址栏输入 %TEMP%，找 reel-studio-crash.log
        - macOS：终端里执行 `cat "$TMPDIR/reel-studio-crash.log"`
      render: text
  - type: checkboxes
    id: checked
    attributes:
      label: 先确认
      options:
        - label: "第一次打开被系统拦了（macOS：右键「打开」或 `xattr -dr com.apple.quarantine`；Windows：SmartScreen 点「更多信息 → 仍要运行」）"
        - label: "已经附上排障报告或崩溃日志"
