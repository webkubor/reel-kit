<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{width:{{width}}px;height:{{height}}px;margin:0;background:#faf9f6;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;position:relative;overflow:hidden}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:{{fit}}}header{position:absolute;inset:0 0 auto;padding:64px 60px 100px;background:linear-gradient(#0009,transparent)}small{font-size:24px;letter-spacing:3px}h1{font-size:54px;line-height:1.2;margin:16px 0 0;overflow-wrap:anywhere;max-width:90%;text-shadow:0 2px 14px #0008}.caption{position:absolute;inset:auto 0 0;padding:120px 60px 90px;background:linear-gradient(transparent,#000b)}p{font-size:48px;font-weight:650;line-height:1.5;margin:0;overflow-wrap:anywhere;text-shadow:0 2px 10px #0008}footer{margin-top:24px;font-size:22px;opacity:.8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style></head><body><img class="scene" src="{{image}}" alt="项目画面"><header><small>开源项目推荐</small><h1>{{title}}</h1></header><div class="caption"><p>{{caption}}</p><footer>{{subtitle}}</footer></div></body></html>
