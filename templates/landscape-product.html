<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /*
   * landscape-product — 1920×1080 横版(产品演示 / 课程封面 / 公众号题图)。
   *
   * 模板作者须知:
   *   画布尺寸必须写在 body 的 width/height,render.mjs 会从这里读 viewport。
   *   占位符 {{title}} {{subtitle}} {{caption}} {{footer}} {{image}} {{bg}} {{accent1}} {{accent2}}。
   *   图片由 render.mjs 转成 data URI 注入,不要引外部资源。
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px; height: 1080px;
    background: {{bg}};
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    position: relative; overflow: hidden;
    display: flex; flex-direction: row; align-items: center;
  }

  .arc { position: absolute; border-radius: 50%; }
  .arc-tl { width: 600px; height: 540px; top: -260px; left: -120px; background: {{accent1}}; }
  .arc-br { width: 540px; height: 480px; bottom: -220px; right: -140px; background: {{accent2}}; }

  /* 左半:图片 · 右半:文案,横版最常见的版式 */
  .stage {
    z-index: 2; width: 50%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 60px;
  }
  .stage img {
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 32px;
    filter: drop-shadow(0 12px 34px rgba(0,0,0,0.16));
  }

  .panel {
    z-index: 2; width: 50%; padding: 80px 96px 80px 40px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .title {
    font-size: 88px; font-weight: 800; color: #1f1f1f; letter-spacing: 2px;
  }
  .subtitle {
    margin-top: 24px; font-size: 36px; color: #9a9a9a; letter-spacing: 4px;
  }
  .caption {
    margin-top: 64px;
    font-size: 44px; font-weight: 600; color: #2a2a2a; line-height: 1.5;
  }
  .footer {
    margin-top: 80px; font-size: 28px; color: #a5a5a5; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="arc arc-tl"></div>
  <div class="arc arc-br"></div>
  <div class="stage"><img src="{{image}}" alt=""></div>
  <div class="panel">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
    <div class="caption">{{caption}}</div>
    <div class="footer">{{footer}}</div>
  </div>
</body>
</html>
