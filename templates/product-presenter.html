<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{width:{{width}}px;height:{{height}}px;margin:0;background:#0d0f11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;position:relative;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 52%,rgba(0,0,0,.82) 100%)}
.bar{position:absolute;top:5%;left:6%;right:6%;display:flex;align-items:center;gap:14px}
.badge{font-size:26px;letter-spacing:2px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 22px;backdrop-filter:blur(6px)}
h1{font-size:44px;font-weight:700;margin:0;letter-spacing:.5px;text-shadow:0 2px 12px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption{position:absolute;left:7%;right:7%;bottom:15%}
.caption p{margin:0;font-size:60px;line-height:1.28;font-weight:700;text-shadow:0 3px 18px rgba(0,0,0,.6);word-break:break-word}
footer{position:absolute;left:7%;right:7%;bottom:5%;font-size:30px;color:rgba(255,255,255,.86);display:flex;align-items:center;gap:10px}
footer::before{content:"";width:8px;height:8px;border-radius:50%;background:{{accent1}}}
</style></head><body><img class="scene" src="{{image}}" alt="出镜画面"><div class="shade"></div><div class="bar"><span class="badge">{{subtitle}}</span><h1>{{title}}</h1></div><div class="caption"><p>{{caption}}</p></div><footer>{{footer}}</footer></body></html>
