<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 知识大赏 · 东方古风模板（1080×1920 竖版）
     吸收自 vibe-knowledge：古风/长卷/暗金家族
     特点：夜色赭黑暗场、朱红印章、金线暗调、典籍出处、典雅宋体 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1920px;
    background: {{bg}};
    color: #f3e6cc;
    font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "STSong", serif;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 120px 80px 100px;
  }

  /* 默认古风底色回退：夜色赭黑 */
  :root {
    --gufeng-bg: #140d0b;
    --vermilion: {{accent1}}; /* 朱红 #d9472b */
    --gold: {{accent2}};      /* 金色 #e2b45a */
    --ink-dim: #a8977c;
  }

  /* 背景古旧纸纹质感与暗角 */
  .paper-grain {
    position: absolute; inset: 0;
    background: 
      radial-gradient(ellipse at 50% 45%, rgba(20, 13, 11, 0.4) 40%, rgba(5, 3, 2, 0.85) 100%),
      linear-gradient(180deg, rgba(20, 13, 11, 0.2) 0%, rgba(5, 3, 2, 0.6) 100%);
    pointer-events: none; z-index: 1;
  }

  /* 细金线外框边界 */
  .frame-border {
    position: absolute; inset: 40px;
    border: 1px solid rgba(226, 180, 90, 0.25);
    border-radius: 4px; pointer-events: none; z-index: 1;
  }
  .frame-corner {
    position: absolute; width: 18px; height: 18px;
    border: 2px solid var(--gold); pointer-events: none; z-index: 2;
  }
  .corner-tl { top: 35px; left: 35px; border-right: none; border-bottom: none; }
  .corner-tr { top: 35px; right: 35px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: 35px; left: 35px; border-right: none; border-top: none; }
  .corner-br { bottom: 35px; right: 35px; border-left: none; border-top: none; }

  /* 顶部：印章与出处 */
  .header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    z-index: 2; margin-bottom: 20px;
  }
  .seal-tag {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px;
    background: var(--vermilion); color: #fff;
    border-radius: 8px; font-size: 26px; font-weight: 900;
    border: 2px solid #b8341b;
    box-shadow: 0 4px 12px rgba(217, 71, 43, 0.4);
    letter-spacing: 1px;
  }
  .source {
    font-size: 26px; color: var(--gold); letter-spacing: 2px;
    background: rgba(0, 0, 0, 0.5); padding: 8px 20px; border-radius: 4px;
    border: 1px solid rgba(226, 180, 90, 0.3);
    max-width: 600px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 标题区 */
  .head {
    width: 100%; text-align: center; z-index: 2; margin-top: 15px;
  }
  .title {
    font-size: 78px; font-weight: 900; line-height: 1.25;
    color: #f3e6cc; letter-spacing: 4px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
  }
  .subtitle {
    margin-top: 16px; font-size: 36px; color: var(--ink-dim); letter-spacing: 5px;
  }

  /* 画卷主视觉区 */
  .stage {
    width: 100%; flex: 1; max-height: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 2; padding: 25px 0;
  }
  .scroll-stage {
    width: 100%; height: 100%; position: relative;
    border-radius: 12px; overflow: hidden;
    border: 2px solid rgba(226, 180, 90, 0.4);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
    background: #090605;
  }
  .scroll-stage img {
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  }

  /* 底部文案与断句 */
  .caption-box {
    width: 100%; z-index: 2; text-align: center;
    padding: 34px 40px; border-radius: 8px;
    background: rgba(15, 10, 8, 0.85);
    border: 1px solid rgba(226, 180, 90, 0.2);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    margin-bottom: 20px;
    min-height: 160px;
    display: flex; align-items: center; justify-content: center;
  }
  .caption {
    font-size: 58px; font-weight: 700; line-height: 1.45;
    color: #f5eedf; letter-spacing: 3px;
  }
  .caption span.highlight {
    color: var(--gold); border-bottom: 2px solid var(--vermilion);
  }

  /* 底部尾花 */
  .footer {
    width: 100%; text-align: center; z-index: 2;
    font-size: 28px; color: var(--ink-dim); letter-spacing: 4px;
  }
</style>
</head>
<body>
  <div class="paper-grain"></div>
  <div class="frame-border"></div>
  <div class="frame-corner corner-tl"></div>
  <div class="frame-corner corner-tr"></div>
  <div class="frame-corner corner-bl"></div>
  <div class="frame-corner corner-br"></div>

  <div class="header">
    <div class="seal-tag">史</div>
    <div class="source">{{source}}</div>
  </div>

  <div class="head">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
  </div>

  <div class="stage">
    <div class="scroll-stage">
      <img src="{{image}}" alt="">
    </div>
  </div>

  <div class="caption-box">
    <div class="caption">{{caption}}</div>
  </div>

  <div class="footer">{{footer}}</div>

  <script>
    const srcEl = document.querySelector('.source');
    if (srcEl && (!srcEl.textContent.trim() || srcEl.textContent.includes('{{source}}'))) {
      srcEl.style.display = 'none';
    }
  </script>
</body>
</html>
