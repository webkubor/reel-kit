<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 知识大赏 · 深色概念与科技模板（1080×1920 竖版）
     吸收自 vibe-knowledge：暗场概念/深色数学/星空光点风格
     特点：深邃暗场、高对比发光强调、极简网格呼吸感、出处角标 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1920px;
    background: {{bg}};
    color: #eef0f6;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, sans-serif;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 120px 80px 100px;
  }

  /* 默认配色回退 */
  :root {
    --bg-color: #0c0e14;
    --accent: {{accent1}};
    --accent-sub: {{accent2}};
  }

  /* 背景细腻网格与星芒光晕 */
  .grid-bg {
    position: absolute; inset: 0;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 1;
  }

  .glow {
    position: absolute; width: 800px; height: 800px; border-radius: 50%;
    filter: blur(120px); opacity: 0.18; pointer-events: none; z-index: 1;
  }
  .glow-top { top: -200px; left: 50%; transform: translateX(-50%); background: var(--accent); }
  .glow-bottom { bottom: -200px; right: -100px; background: var(--accent-sub); }

  /* 顶部：系列与出处 */
  .header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    z-index: 2; margin-bottom: 20px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 20px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 26px; font-weight: 600; letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
  }
  .badge::before {
    content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .source {
    font-size: 24px; color: #8a90a3; letter-spacing: 1px;
    background: rgba(0, 0, 0, 0.4); padding: 6px 16px; border-radius: 8px;
    border-left: 3px solid var(--accent);
    max-width: 550px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 标题区 */
  .head {
    width: 100%; text-align: center; z-index: 2; margin-top: 20px;
  }
  .title {
    font-size: 76px; font-weight: 800; line-height: 1.25;
    color: #ffffff; letter-spacing: 1px;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  }
  .subtitle {
    margin-top: 18px; font-size: 36px; color: #9da4b8; letter-spacing: 3px;
  }

  /* 核心视觉展示区 */
  .stage {
    width: 100%; flex: 1; max-height: 52%;
    display: flex; align-items: center; justify-content: center;
    z-index: 2; padding: 30px 10px; position: relative;
  }
  .stage-box {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative; border-radius: 24px; overflow: hidden;
    background: rgba(20, 24, 35, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }
  .stage-box img {
    width: 100%; height: 100%; object-fit: contain;
    border-radius: 20px;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
  }

  /* 提示与出处水印 */
  .watermark {
    position: absolute; right: 24px; top: 20px;
    font-size: 20px; color: rgba(255, 255, 255, 0.4);
    background: rgba(0, 0, 0, 0.5); padding: 4px 12px; border-radius: 6px;
    letter-spacing: 1px;
  }

  /* 底部字幕与结论 */
  .caption-box {
    width: 100%; z-index: 2; text-align: center;
    padding: 30px 40px; border-radius: 20px;
    background: rgba(18, 22, 33, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(20px);
    margin-bottom: 24px;
    min-height: 160px;
    display: flex; align-items: center; justify-content: center;
  }
  .caption {
    font-size: 56px; font-weight: 700; line-height: 1.4;
    color: #ffffff; letter-spacing: 1px;
  }
  .caption em {
    color: var(--accent); font-style: normal;
  }

  /* 底部引导 */
  .footer {
    width: 100%; text-align: center; z-index: 2;
    font-size: 28px; color: #767d92; letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <div class="header">
    <div class="badge">VIBE KNOWLEDGE</div>
    <div class="source">{{source}}</div>
  </div>

  <div class="head">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
  </div>

  <div class="stage">
    <div class="stage-box">
      <img src="{{image}}" alt="">
      <div class="watermark">AI SCHEMATIC</div>
    </div>
  </div>

  <div class="caption-box">
    <div class="caption">{{caption}}</div>
  </div>

  <div class="footer">{{footer}}</div>

  <script>
    // 若 source 占位符未填，隐藏角标
    const srcEl = document.querySelector('.source');
    if (srcEl && (!srcEl.textContent.trim() || srcEl.textContent.includes('{{source}}'))) {
      srcEl.style.display = 'none';
    }
  </script>
</body>
</html>
