<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1000px; height: 1000px; background: #ffffff; display: flex; align-items: center; justify-content: center; font-family: -apple-system, "PingFang SC", sans-serif; }
  .card { width: 880px; display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: center; gap: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 26px 30px; }
  .ico { font-size: 34px; width: 56px; text-align: center; }
  .t { font-size: 26px; font-weight: 600; color: #e6edf3; }
  .s { font-size: 17px; color: #8b949e; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="row"><span class="ico">🦀</span><div><div class="t">Rust 编写</div><div class="s">单二进制 · Apple Silicon 原生 · 快</div></div></div>
    <div class="row"><span class="ico">🔒</span><div><div class="t">AES-256-GCM</div><div class="s">密钥加密后才落盘 · 全本地不联网</div></div></div>
    <div class="row"><span class="ico">🔓</span><div><div class="t">MIT 开源</div><div class="s">可审计 · 无订阅 · 无遥测</div></div></div>
  </div>
</body>
</html>
