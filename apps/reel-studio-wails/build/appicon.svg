<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="muse-tv 应用图标">
  <title>muse-tv</title>
  <defs>
    <!-- 近黑冷灰底，与工作台 paper 层同色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242a"/>
      <stop offset="0.55" stop-color="#121417"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <!-- 顶部冷光 -->
    <radialGradient id="beam" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#e8eaed" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#e8eaed" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e8eaed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#beam)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="224" fill="none" stroke="rgba(213,217,223,0.16)" stroke-width="4"/>
  <!-- 标记：与侧栏 logo 同形（双环 + 十字准星），银白冷光 -->
  <g transform="translate(252,252) scale(13.684)" fill="none" stroke="#d5d9df" stroke-linecap="round">
    <circle cx="19" cy="19" r="19" stroke-width="2.2"/>
    <circle cx="19" cy="19" r="10" stroke-width="2"/>
    <g fill="#d5d9df" stroke="none">
      <circle cx="19" cy="19" r="3.4"/>
      <circle cx="19" cy="4" r="1.9"/>
      <circle cx="19" cy="34" r="1.9"/>
      <circle cx="4" cy="19" r="1.9"/>
      <circle cx="34" cy="19" r="1.9"/>
    </g>
  </g>
</svg>
